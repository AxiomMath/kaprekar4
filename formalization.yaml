# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

version: "v0.4"

project:
  name: "Kaprekar4"
  authors: [Kenny Lau]
  description: >
    `Kaprekar4` is a formal proof of the structural classification of four-digit Kaprekar dynamics
    in odd bases, and of the cycle counts it yields, from *Four-digit Kaprekar dynamics in odd
    bases* (arXiv:2606.20439). It proves Theorem 1.1, Corollary 1.2 and Corollary 1.3. The Lean
    files were generated by AxiomProver, Axiom Math's in-house theorem proving system.
  responsible_maintainers: [Kenny Lau]
  license: "MIT"

repository:
  role: "substantive-development"

sources:
  - title: "Four-digit Kaprekar dynamics in odd bases"
    authors: [Evan Chen, Ken Ono, Richard E. Schwartz, Dinesh S. Thakur]
    id: "https://arxiv.org/abs/2606.20439"
    type: "article"
    location: "Theorem 1.1, Corollary 1.2, Corollary 1.3"
    relationship: "formalizes"
    note: >
      Formalizes the conjugacy of the map on the stable region with projective doubling, and the
      two cycle-count corollaries that follow from it.

classification:
  arxiv: [math.NT, math.CO]
  msc2020: [11A63, 05A15, 37P99]

status:
  scope: >
    Theorem 1.1, Corollary 1.2 and Corollary 1.3, for every odd base $B > 3$. The dynamics are
    formalized in the difference coordinates $(d_1, d_2)$, which `problem.lean` justifies from the
    four-digit description.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Quot.sound, Classical.choice]
  main_results:
  - declaration: "thm_structural"
    file: "Kaprekar4/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator.json"
  - declaration: "cor_length"
    file: "Kaprekar4/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator.json"
  - declaration: "cor_prime"
    file: "Kaprekar4/solution.lean"
    sorry_count: 0
    axioms: [propext, Quot.sound, Classical.choice]
    comparator_config: "comparator.json"

automation:
  methods:
    - method: "autonomous"
      models: [AxiomProver]

review:
  status: "author-verified"
  reviewers: [Kenny Lau]
  notes: >
    The formal challenge in `Kaprekar4/problem.lean` was checked against the source paper by an
    author of that paper.

alignment:
  statements:
    - source: "Four-digit Kaprekar dynamics in odd bases (Theorem 1.1)"
      lean: "thm_structural"
      module: "Kaprekar4.solution"
      status: >
        Proved, with bijectivity of the conjugating map as a separate conjunct; the paper notes
        that the statement makes it an implicit promise.
    - source: "Four-digit Kaprekar dynamics in odd bases (Corollary 1.2)"
      lean: "cor_length"
      module: "Kaprekar4.solution"
      status: "Proved."
    - source: "Four-digit Kaprekar dynamics in odd bases (Corollary 1.3)"
      lean: "cor_prime"
      module: "Kaprekar4.solution"
      status: "Proved."
